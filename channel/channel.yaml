# Channel settings — every episode is rendered with these unless the episode overrides them.
name: "CoinSense"
language: en

schedule:
  long_per_week: 2             # Mon + Thu
  shorts_per_long: 6           # ~2 Shorts a day across the week

video:
  fps: 30
  long:  { width: 1920, height: 1080 }
  short: { width: 1080, height: 1920 }
  crossfade_frames: 8          # soft cut between shots
  pause_after_beat: 0.18       # seconds of silence after each narration beat
  min_shot_seconds: 1.4        # a shot is never shorter than this
  max_shot_seconds: 3.2        # longer shots are split so something changes every 1–3 s
  crf: 21                      # video quality (lower = better/bigger)
  x264_preset: veryfast

style:
  # Look: 1950s print advertising + flat infographics + red investigator marker + 50s comics + archive photos.
  prompt_prefix: "Single clear subject, simple stylized shapes, "
  prompt_suffix: >-
    1950s American print advertisement illustration, gouache and halftone print texture,
    limited palette of cream, money green, tomato red and ink black, bold flat shapes,
    clean composition with one clear subject, warm paper grain, mid-century commercial art
  variants:
    ad:
      prompt_suffix: >-
        1950s American print advertisement illustration, gouache and halftone print texture,
        limited palette of cream, money green, tomato red and ink black, bold flat shapes,
        clean composition with one clear subject, warm paper grain, mid-century commercial art
    comic:
      prompt_suffix: >-
        1950s comic book panel, bold black ink outlines, Ben-Day halftone dots, flat cream,
        money green and tomato red colors, expressive faces, dramatic angle, clean empty space
        at the top of the panel, vintage newsprint texture
  palette:
    paper:  "#F3E9D2"
    ink:    "#1E1B18"
    green:  "#2E6B4F"
    red:    "#D2452F"
    accent: "#E8B53A"
  grain: 0.03                  # paper grain baked into pictures, 0 = off

fonts:
  # First existing file wins. The workflow downloads these Google Fonts; DejaVu is the local fallback.
  headline: ["assets/fonts/Anton-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  body:     ["assets/fonts/ArchivoBlack-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  comic:    ["assets/fonts/Bangers-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  marker:   ["assets/fonts/PermanentMarker-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-BoldOblique.ttf"]

voice:
  engine: kokoro
  lang_code: b                 # b = British English
  voice: bm_george             # British male, documentary tone; alternatives: bm_fable, bm_lewis, bm_daniel
  speed: 0.98

audio:
  narration_db: 0
  sfx_db: -16
  music_db: -24                # background music level (only if files exist in assets/music)
  duck_db: -8                  # extra music reduction while the narrator speaks
  target_lufs: -14

images:
  provider: cloudflare
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 4
  max_per_episode: 150         # free tier is ~170 images/day at 1024px — keep headroom
