# Channel settings — every episode is rendered with these unless the episode overrides them.
name: "CoinSense"
language: en

schedule:
  long_per_week: 2             # Mon + Thu
  shorts_per_long: 6           # ~2 Shorts a day across the week

video:
  fps: 30
  long:  { width: 1920, height: 1080 }
  short: { width: 1080, height: 1920 }
  crossfade_frames: 8          # soft cut between shots
  pause_after_beat: 0.18       # seconds of silence after each narration beat
  min_shot_seconds: 1.4        # a shot is never shorter than this
  max_shot_seconds: 3.2        # longer shots are split so something changes every 1–3 s
  crf: 21                      # video quality (lower = better/bigger)
  long_min_seconds: 482        # mid-roll ads need 8:00+; pauses stretch slightly if the narration is shorter
  hook_seconds: 30             # the first 30 s cut faster: attention is won or lost here
  hook_max_shot_seconds: 1.8
  x264_preset: veryfast

style:
  # Look: 1950s print advertising + flat infographics + red investigator marker + 50s comics + archive photos.
  prompt_prefix: "Single clear subject centered in the frame, simple stylized shapes, plain unlabeled surfaces, "
  prompt_suffix: >-
    1950s American print advertisement illustration, gouache and halftone print texture,
    limited palette of cream, money green, tomato red and ink black, bold flat shapes,
    clean composition with one clear subject, warm paper grain, mid-century commercial art
  variants:
    ad:
      prompt_suffix: >-
        1950s American print advertisement illustration, gouache and halftone print texture,
        limited palette of cream, money green, tomato red and ink black, bold flat shapes,
        clean composition with one clear subject, warm paper grain, mid-century commercial art
    comic:
      prompt_suffix: >-
        1950s comic book panel, bold black ink outlines, Ben-Day halftone dots, flat cream,
        money green and tomato red colors, expressive faces, dramatic angle, clean empty space
        at the top of the panel, vintage newsprint texture
  palette:
    paper:  "#F3E9D2"
    ink:    "#1E1B18"
    green:  "#2E6B4F"
    red:    "#D2452F"
    accent: "#E8B53A"
  grain: 0.03                  # paper grain baked into pictures, 0 = off
  vignette: 0.18               # soft dark edges on every frame (Vox-style texture), 0 = off

fonts:
  # First existing file wins. The workflow downloads these Google Fonts; DejaVu is the local fallback.
  headline: ["assets/fonts/Anton-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  body:     ["assets/fonts/ArchivoBlack-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  comic:    ["assets/fonts/Bangers-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  marker:   ["assets/fonts/PermanentMarker-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-BoldOblique.ttf"]
  serif_bold: ["assets/fonts/OldStandard-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"]
  serif_old: ["assets/fonts/OldStandard-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"]
  typewriter: ["assets/fonts/SpecialElite-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"]
  serif:    ["assets/fonts/PT_Serif-Web-Regular.ttf", "assets/fonts/OldStandard-Regular.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"]

voice:
  engine: kokoro
  lang_code: b                 # b = British English
  voice: bm_lewis              # the Inspector (chosen from samples 17 Oct 2026); alternatives: bm_george, bm_fable, bm_daniel
  speed: 0.98

audio:
  narration_db: 0
  sfx_db: -16
  music_db: -4                 # music bed (cues are normalised to -20 dBFS RMS): ~-24 in pauses
  duck_db: -5                  # gentle, smooth dip while the narrator speaks (no pumping)
  sting_db: -2                 # short musical hits (fanfare, reveal, case closed)
  target_lufs: -14

images:
  provider: auto               # auto = OpenRouter (OPENROUTER_API_KEY) → Gemini (GEMINI_API_KEY) → Cloudflare
  openrouter_model: google/gemini-3.1-flash-image-preview   # Nano Banana 2 via OpenRouter
  gemini_model: gemini-nano-banana-2.1
  gemini_size: 1K
  aspect_ratio: "16:9"
  gemini_quality_suffix: >-
    Crisp professional illustration, clean confident linework, only the subjects described,
    people (when present) with natural anatomy and warm skin tones, unsigned artwork,
    precise round geometric objects, unlettered surfaces, cinematic composition with depth and a clear foreground.
  model: "@cf/black-forest-labs/flux-1-schnell"   # Cloudflare fallback
  width: 1280
  height: 720
  steps: 4
  max_per_episode: 150         # free tier is ~170 images/day at 1024px — keep headroom
