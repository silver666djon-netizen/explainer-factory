name: Storyboard

# A new or changed script makes the storyboard first (all frames + contact sheets in Telegram).
# The montage runs only after the storyboard is approved (Render episode workflow).
# Started on purpose only (no automatic run on every script edit — saves Actions minutes and Telegram clutter).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder name, e.g. 0002-casino-chips"
        required: true
      redo:
        description: "Frames to regenerate, e.g. b17,c03 (empty = only missing ones)"
        required: false
        default: ""
      send:
        description: "send contact sheets to Telegram (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: storyboard
  cancel-in-progress: false

jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick episodes
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            list="${{ github.event.inputs.episode }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            list=$(git diff --name-only "$before" HEAD -- 'episodes/*/script.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "Episodes: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages and fonts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core poppler-utils
          mkdir -p assets/fonts
          base=https://github.com/google/fonts/raw/main
          for f in ofl/anton/Anton-Regular.ttf ofl/archivoblack/ArchivoBlack-Regular.ttf; do
            curl -fsSL -o "assets/fonts/$(basename $f)" "$base/$f" || true
          done

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-v1

      - name: Restore generated images
        uses: actions/cache/restore@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: Reuse frames already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ep in ${{ steps.pick.outputs.list }}; do
            mkdir -p ".cache/images/$ep"
            gh release download "frames-$ep" -D ".cache/images/$ep" --clobber 2>/dev/null || echo "no frames yet for $ep"
          done

      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Archive media used by this episode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/archive
          for ep in episodes/*/script.json; do
            python3 - "$ep" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          files = {v["file"] for b in s["beats"] for v in [b["visual"]] if v.get("type") in ("archive", "clip") and v.get("file")}
          print("\n".join(sorted(files)))
          PY
          done | sort -u | while read f; do [ -n "$f" ] && [ ! -s "assets/archive/$f" ] && gh release download archive -D assets/archive --pattern "$f" --clobber || true; done
          ls -la assets/archive || true
          # stock files fetched earlier live in the same release
          gh release download archive -D assets/archive --pattern "stock-*" --clobber 2>/dev/null || true

      - name: Storyboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          for ep in ${{ steps.pick.outputs.list }}; do
            python -m factory.storyboard "episodes/$ep" --redo "${{ github.event.inputs.redo }}" ${{ github.event.inputs.send != 'yes' && '--no-telegram' || '' }} 2>&1 | tee -a build.log
          done

      - name: Save generated images
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}

      - name: Keep fetched stock media
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls assets/archive/stock-* >/dev/null 2>&1 || exit 0
          gh release view archive >/dev/null 2>&1 || gh release create archive --title "Archive media" --notes "Public-domain and stock media used in episodes"
          for f in assets/archive/stock-*; do gh release upload archive "$f" --clobber; done

      - name: Publish frames + contact sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ep in ${{ steps.pick.outputs.list }}; do
            gh release delete "frames-$ep" -y --cleanup-tag 2>/dev/null || true
            gh release create "frames-$ep" out/frames/$ep/* out/storyboard/$ep/*.jpg --title "Storyboard $ep" \
              --notes "Frames and depth maps for $ep. Contact sheets: sheet_*.jpg" --prerelease
          done

      - name: Save frame variants, character portraits and prompt packs
        run: |
          git config user.name "explainer-factory-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in assets/characters episodes/*/frames.json episodes/*/prompt_pack.md; do [ -e "$p" ] && git add "$p"; done
          git status --short
          git commit -m "Storyboard: variants, characters, prompt packs" || echo "nothing to commit"
          git pull --rebase -q origin main && git push || true

      - name: Report error details
        if: failure()
        run: |
          tail -n 60 build.log 2>/dev/null | python3 -c 'import sys; t=sys.stdin.read()[-6000:]; print("::error title=Storyboard failed::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Раскадровка не удалась. Claude посмотрит причину." > /dev/null || true
