name: Fetch archive
# Downloads public-domain archive files (LOC, archive.org, NARA, FTC…) into the release "archive"
# so the render runners (and Claude, via the GitHub API) can use them. Started on purpose only.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "path to a JSON list: [{\"name\": \"file.jpg\", \"url\": \"https://…\"}, …]"
        required: true
        default: "archive/fetch.json"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        if: ${{ !startsWith(github.event.inputs.list, 'archive/probe') }}
        run: |
          mkdir -p out/archive
          python3 archive/fetch_loc.py "${{ github.event.inputs.list }}"
          ls -la out/archive
      - name: Probe (optional)
        if: ${{ startsWith(github.event.inputs.list, 'archive/probe') }}
        run: |
          mkdir -p out/archive
          l="${{ github.event.inputs.list }}"
          python3 "archive/loc_${l#archive/}.py"
          ls out/archive | head -100
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view archive >/dev/null 2>&1 || gh release create archive --title "Archive media" --notes "Public-domain photos, clips and documents used in episodes"
          cd out/archive && for f in *; do gh release upload archive "$f" --clobber; done
