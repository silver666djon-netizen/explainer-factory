name: TTS probe
# Synthesises every long beat of an episode one by one with a time limit and reports slow or hanging lines.
on:
  workflow_dispatch:
    inputs:
      episode:
        required: true
        default: "0005-drip-pricing"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Archive media + storyboard frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ep="${{ github.event.inputs.episode }}"
          mkdir -p assets/archive ".cache/images/$ep"
          gh release download archive -D assets/archive --clobber || true
          tools/rel.sh download "frames-$ep" ".cache/images/$ep" "*.png" || true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/images
          key: images-none
          restore-keys: images-
      - run: python tools/tts_probe.py "episodes/${{ github.event.inputs.episode }}" 90
      - name: Publish real voice timings (for local plan debugging)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ep="${{ github.event.inputs.episode }}"
          [ -s voiced.json ] || exit 0
          tools/rel.sh delete "probe-$ep" || true
          gh release create "probe-$ep" voiced.json --title "TTS probe $ep" --notes "real narration timings" --prerelease --draft
