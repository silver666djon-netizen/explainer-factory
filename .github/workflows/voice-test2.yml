name: Ep.4 v2 voice test 2 (directed line by line)
# Klot r9: Принц Нур (eleven_v3) directed sentence by sentence, Take 1 / Take 2 of every punchline, Take E in English
# (fable), STT per clip, a Voice Changer API probe. Draft ep04v2-voicetest2 + Telegram "CoinSense · EP04v2 · VOICE TEST 2".
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q numpy requests pyyaml faster-whisper num2words 2>&1 | tail -2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-ru-v1
      - name: Voice test 2
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          python tools/ru_voice_test2.py out 2>&1 | tee test.log
          grep -E "^(account|Take|Voice Changer|  \()" test.log | python3 -c 'import sys; print("::notice title=voice test 2::" + sys.stdin.read().replace("%","%25").replace("\n","%0A"))'
      - name: Publish into the draft ep04v2-voicetest2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls out/voice_test2_*.mp3 out/voice_test2.md out/voice_test2_note.txt out/voice_changer_probe.mp3 2>/dev/null || true)
          if tools/rel.sh id ep04v2-voicetest2 >/dev/null 2>&1; then tools/rel.sh upload ep04v2-voicetest2 $files
          else gh release create ep04v2-voicetest2 $files --title "CoinSense · EP04v2 · VOICE TEST 2" --notes "Voice test 2 (not for upload)." --prerelease --draft; fi
      - name: Send to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/send_files.py out "CoinSense · EP04v2 · VOICE TEST 2" --text voice_test2_note.txt voice_test2_1.mp3 voice_test2_2.mp3 voice_test2_E.mp3 voice_test2.md
