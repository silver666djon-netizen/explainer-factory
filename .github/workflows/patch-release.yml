name: Patch release text
# Replaces text assets (description.txt, metadata.json, …) of a checked release with the files in
# patches/<tag>/ and refreshes the release notes from description.txt. Started on purpose only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. 0003-same-basket-r49"
        required: true
      new_tag:
        description: "optional: give the release this tag (repairs a draft whose tag was lost); files come from patches/<new_tag>/"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload patched files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="${{ github.event.inputs.tag }}"
          n="${{ github.event.inputs.new_tag }}"; n="${n:-$t}"
          test -d "patches/$n"
          id=$(tools/rel.sh id "$t")
          tools/rel.sh upload "$t" patches/$n/*
          # tag_name is sent every time: a PATCH without it turns an untagged draft's tag into "untagged-…"
          if [ -f "patches/$n/description.txt" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f "tag_name=$n" -F "body=@patches/$n/description.txt" >/dev/null
          else gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f "tag_name=$n" >/dev/null; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q ".tag_name"
