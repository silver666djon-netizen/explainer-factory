name: STT diff of a release
# Klot r89 #7: the published videos' narration transcribed line by line and diffed against the script
# (tools/qc/stt_release.py). The line spans are rebuilt here from the release's timings.json with the real voice
# (Short-only lines are not in timings.json), then every line of every video is transcribed on its own.
# Writes stt_diff.md / stt_diff.json into the release. Any difference fails this job and blocks the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. 0005-drip-pricing-r90"
        required: true
      episode:
        required: true
        default: "0005-drip-pricing"
permissions:
  contents: write
jobs:
  stt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-whisper-v1
          restore-keys: kokoro-
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt faster-whisper
      - name: Download the videos, timings, storyboard frames and archive media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ep="${{ github.event.inputs.episode }}"
          tools/rel.sh download "${{ github.event.inputs.tag }}" rel "*.mp4" "timings.json"
          mkdir -p ".cache/images/$ep" assets/archive
          tools/rel.sh download "frames-$ep" ".cache/images/$ep" "*.png" || true
          gh release download archive -D assets/archive --clobber || true
      - name: Line spans (real plan, real voice)
        env:
          STT_REAL_VOICE: "1"
        run: |
          set -o pipefail
          python tools/qc/stt_release.py spans "episodes/${{ github.event.inputs.episode }}" rel/timings.json stt_spans.json 2>&1 | tee spans.log \
            || { tail -n 25 spans.log | python3 -c 'import sys; print("::error title=spans::" + sys.stdin.read()[-4000:].replace("%","%25").replace("\n","%0A"))'; exit 1; }
      - name: Transcribe + diff
        id: stt
        run: |
          t="${{ github.event.inputs.tag }}"
          python tools/qc/stt_release.py check "episodes/${{ github.event.inputs.episode }}" stt_spans.json rel stt_diff.md 2> check.log \
            && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "ok=0" >> "$GITHUB_OUTPUT"
      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s stt_diff.md ] && tools/rel.sh upload "${{ github.event.inputs.tag }}" stt_diff.md stt_diff.json stt_spans.json
          [ -s check.log ] && tail -n 25 check.log | python3 -c 'import sys; t=sys.stdin.read()[-4000:]; t and print("::warning title=check stderr::" + t.replace("%","%25").replace("\n","%0A"))'
          [ "${{ steps.stt.outputs.ok }}" = "1" ]
