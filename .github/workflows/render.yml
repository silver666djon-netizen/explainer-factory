name: Render episode

# Runs after the storyboard is approved (button in Telegram, or dispatched by Claude).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder name, e.g. 0001-why-9-99"
        required: true
      only:
        description: "long / shorts / empty = everything"
        required: false
        default: ""
      preview:
        description: "yes = fast low-res draft for Claude's QC (release <slug>-preview, nothing sent to Telegram)"
        required: false
        default: "no"
      upto:
        description: "preview only: 'cf1' = the opening up to and including cf1; 'z0..z5' = one part from z0 to z5 (empty = whole video)"
        required: false
        default: ""
      send:
        description: "yes = send to Telegram right away (normally no: send only after QC, with the Notify workflow - rule 22)"
        required: false
        default: "no"
      lang:
        description: "language version from episodes/<slug>/lang/<code>.json, e.g. ru (long video only; release <slug>-<code>-rN)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick episodes
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            list="${{ github.event.inputs.episode }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            list=$(git diff --name-only "$before" HEAD -- 'episodes/*/script.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "Episodes: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core poppler-utils

      - name: Fonts
        run: |
          mkdir -p assets/fonts
          base=https://github.com/google/fonts/raw/main
          for f in ofl/anton/Anton-Regular.ttf ofl/archivoblack/ArchivoBlack-Regular.ttf \
                   ofl/bangers/Bangers-Regular.ttf apache/permanentmarker/PermanentMarker-Regular.ttf \
                   ofl/ptserif/PT_Serif-Web-Regular.ttf ofl/oldstandardtt/OldStandard-Regular.ttf \
                   ofl/oldstandardtt/OldStandard-Bold.ttf apache/specialelite/SpecialElite-Regular.ttf; do
            curl -fsSL -o "assets/fonts/$(basename $f)" "$base/$f" || echo "font download failed: $f (fallback font will be used)"
          done
          ls -la assets/fonts

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Restore generated images
        uses: actions/cache/restore@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: Music library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/music
          gh release download music-lib -D assets/music --clobber --pattern "*.mp3" 2>/dev/null || echo "no music library yet"
          ls -la assets/music

      - name: Archive media used by this episode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/archive
          for ep in episodes/*/script.json; do
            python3 - "$ep" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          beats = s["beats"] + [b for sh in s.get("shorts") or [] for b in sh["beats"]]
          files = {v["file"] for b in beats for v in [b["visual"]] if v.get("type") in ("archive", "clip") and v.get("file")}
          files |= {i["file"] for b in beats for i in b.get("inserts") or [] if "." in str(i.get("file", ""))}
          files |= {(b["visual"].get("doc") or {}).get("pre_exhibit", {}).get("file") for b in beats
                    if isinstance((b["visual"].get("doc") or {}).get("pre_exhibit"), dict)} - {None}
          print("\n".join(sorted(files)))
          PY
          done | sort -u | while read f; do [ -n "$f" ] && [ ! -s "assets/archive/$f" ] && gh release download archive -D assets/archive --pattern "$f" --clobber || true; done
          ls -la assets/archive || true
          # stock files fetched earlier live in the same release
          gh release download archive -D assets/archive --pattern "stock-*" --clobber 2>/dev/null || true

      - name: Use the approved storyboard frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ep in ${{ steps.pick.outputs.list }}; do
            mkdir -p ".cache/images/$ep"
            tools/rel.sh download "frames-$ep" ".cache/images/$ep" "*.png" 2>/dev/null || echo "no storyboard for $ep, frames will be generated now"
          done

      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Cyrillic fonts (language versions)
        if: github.event.inputs.lang != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/rel.sh download fonts-cyr fc
          python tools/fonts_cyr.py fc
          ls -la assets/fonts

      - name: Render
        timeout-minutes: ${{ github.event.inputs.preview == 'yes' && 25 || 150 }}  # a hung preview fails fast and reports its log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -o pipefail
          only="${{ github.event.inputs.only }}"
          for ep in ${{ steps.pick.outputs.list }}; do
            python -m factory build "episodes/$ep" --out "out/$ep" ${only:+--only $only} ${{ github.event.inputs.preview == 'yes' && '--preview' || '' }} ${{ github.event.inputs.upto && format('--upto {0}', github.event.inputs.upto) || '' }} ${{ github.event.inputs.lang && format('--lang {0}', github.event.inputs.lang) || '' }} 2>&1 | tee -a build.log
          done

      - name: Save generated images (even if the render failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}

      - name: Report error details
        if: failure() || cancelled()
        run: |
          tail -n 60 build.log 2>/dev/null | grep -v "%  (" | python3 -c 'import sys; t=sys.stdin.read()[-6000:]; print("::error title=Render failed::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'

      - name: Keep fetched stock media
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls assets/archive/stock-* >/dev/null 2>&1 || exit 0
          gh release view archive >/dev/null 2>&1 || gh release create archive --title "Archive media" --notes "Public-domain and stock media used in episodes"
          for f in assets/archive/stock-*; do gh release upload archive "$f" --clobber; done

      - name: Publish release + Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          run() { local o; o=$("$@" 2>&1) || { echo "::error title=Publish::$* -> $(echo "$o" | tail -5 | tr '\n' ' ')"; return 1; }; echo "$o"; }
          if [ "${{ github.event.inputs.preview }}" = "yes" ]; then
            for ep in ${{ steps.pick.outputs.list }}; do
              pv="$ep-preview"; [ -n "${{ github.event.inputs.lang }}" ] && pv="$ep-${{ github.event.inputs.lang }}-preview"
              tools/rel.sh delete "$pv" || true
              run gh release create "$pv" out/$ep/*.mp4 $(ls out/$ep/timings.json 2>/dev/null) --title "Preview $ep (draft for QC)" --notes "Low-res draft" --prerelease --draft
            done
            exit 0
          fi
          for ep in ${{ steps.pick.outputs.list }}; do
            tag="$ep-r${{ github.run_number }}"
            lang="${{ github.event.inputs.lang }}"
            [ -n "$lang" ] && tag="$ep-$lang-r${{ github.run_number }}"
            title=$(python -c "import json;print(json.load(open('out/$ep/metadata.json'))['title'])")
            python -m factory.naming rename "out/$ep" "episodes/$ep" "${{ github.run_number }}" "$lang"  # cs_ep04_r78_long.mp4 ...
            run gh release create "$tag" out/$ep/* --title "$title" --notes-file "$(ls out/$ep/*description.txt | head -1)" --draft  # unreleased video: private until published
            url=$(tools/rel.sh url "$tag")
            if [ "${{ github.event.inputs.send }}" = "yes" ]; then python -m factory.notify "out/$ep" "$url" --tag "$tag"; fi
          done
