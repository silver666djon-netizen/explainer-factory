name: Ep.4 v2 RU voice plan B (Voice Changer)
# Klot r9: his own reading of the RU cold open -> Принц Нур (ElevenLabs Voice Changer, eleven_multilingual_sts_v2), his
# timing kept, light denoise only; STT check; draft ep04v2-voicetest2 + Telegram "CoinSense · EP04v2 · RU VOICE · PLAN B"
# next to VOICE TEST 2 Take 1 / Take 2. The recording arrives AES-encrypted (refs/planb/*.enc); the one-time key is the
# input "key", read from the event file (never printed); the decrypted file never leaves the runner.
on:
  workflow_dispatch:
    inputs:
      tg_file:
        description: "Telegram file id of the recording (sent to the bot; the bot starts this run)"
        required: false
        default: ""
      key:
        description: "or: one-time decryption key (hex) for an encrypted recording in the repo"
        required: false
        default: ""
      file:
        description: "the encrypted recording in the repo (with key)"
        required: false
        default: "refs/planb/klot_cold_open.enc"
permissions:
  contents: write
jobs:
  planb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q numpy requests pyyaml faster-whisper num2words cryptography 2>&1 | tail -2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-ru-v1
      - name: Fetch the recording (stays on the runner)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]
          out = os.path.join(os.environ["RUNNER_TEMP"], "klot_rec")
          tok = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          if not ev.get("tg_file") and not ev.get("key"):
              # the latest voice / audio message Klot sent to the bot (getUpdates; works while the bot has no webhook)
              up = requests.get(f"https://api.telegram.org/bot{tok}/getUpdates", params={"limit": 100, "timeout": 0}, timeout=60).json()
              assert up.get("ok"), f"Telegram getUpdates: {up.get('description')}"
              recs = []
              for u in up["result"]:
                  m = u.get("message") or {}
                  f = m.get("voice") or m.get("audio") or (m.get("document") if (m.get("document") or {}).get("mime_type", "").startswith("audio/") else None)
                  if f:
                      recs.append((m["date"], f["file_id"], f.get("duration")))
              assert recs, "no voice / audio message in the bot's chat (send the recording to the bot, then run again)"
              recs.sort()
              ev["tg_file"] = recs[-1][1]
              print(f"latest recording in the bot chat: {recs[-1][2]} s ({len(recs)} found)")
          if ev.get("tg_file"):
              info = requests.get(f"https://api.telegram.org/bot{tok}/getFile", params={"file_id": ev["tg_file"]}, timeout=60).json()
              assert info.get("ok"), "Telegram getFile failed"
              r = requests.get(f"https://api.telegram.org/file/bot{tok}/{info['result']['file_path']}", timeout=300)
              r.raise_for_status()
              open(out, "wb").write(r.content)
              print("recording from Telegram:", len(r.content), "bytes,", info["result"]["file_path"].rsplit(".", 1)[-1])
          else:
              import subprocess
              subprocess.run(["python", "tools/planb_crypt.py", "dec", ev["file"], out], check=True)
              print("recording decrypted:", os.path.getsize(out), "bytes")
          PY
      - name: Voice Changer
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -o pipefail
          python tools/ru_plan_b.py "$RUNNER_TEMP/klot_rec" out 2>&1 | tee planb.log
          grep -E "^(recording|PLAN B)" planb.log | python3 -c 'import sys; print("::notice title=plan b::" + sys.stdin.read().replace("%","%25").replace("\n","%0A"))'
          rm -f "$RUNNER_TEMP/klot_rec"
      - name: Publish into the draft ep04v2-voicetest2 (draft = private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="out/ru_plan_b_nur.mp3 out/ru_plan_b_klot_source.mp3 out/ru_plan_b.md out/ru_plan_b_note.txt"
          if tools/rel.sh id ep04v2-voicetest2 >/dev/null 2>&1; then tools/rel.sh upload ep04v2-voicetest2 $files
          else gh release create ep04v2-voicetest2 $files --title "CoinSense · EP04v2 · VOICE TEST 2" --notes "Voice tests (not for upload)." --prerelease --draft; fi
      - name: Send to Telegram (with VOICE TEST 2 Take 1 / Take 2 for comparison)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          tools/rel.sh download ep04v2-voicetest2 out "voice_test2_1.mp3" "voice_test2_2.mp3" || true
          files="ru_plan_b_nur.mp3 ru_plan_b_klot_source.mp3"
          for f in voice_test2_1.mp3 voice_test2_2.mp3; do [ -f "out/$f" ] && files="$files $f"; done
          python tools/send_files.py out "CoinSense · EP04v2 · RU VOICE · PLAN B" --text ru_plan_b_note.txt $files ru_plan_b.md
