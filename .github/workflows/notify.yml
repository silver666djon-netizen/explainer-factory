name: Notify (send a checked release to Telegram)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. 0002-casino-chips-r45"
        required: true

permissions:
  contents: write  # draft releases are visible only with write access

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pyyaml
      - name: Send
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out/rel
          for k in 1 2 3; do tools/rel.sh download "${{ github.event.inputs.tag }}" out/rel "*.json" "*.mp4" "*.jpg" && break; echo "::warning::download retry $k"; sleep 10; done
          ls -la out/rel || true
          url=$(tools/rel.sh url "${{ github.event.inputs.tag }}")
          python -m factory.notify out/rel "$url" 2>&1 | tee notify.log || { echo "::error::$(tail -3 notify.log | tr '\n' ' ')"; exit 1; }
