name: Notify (send a checked release to Telegram)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. 0002-casino-chips-r45"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pyyaml
      - name: Send
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out/rel
          gh release download "${{ github.event.inputs.tag }}" -D out/rel
          url=$(gh release view "${{ github.event.inputs.tag }}" --json url -q .url)
          python -m factory.notify out/rel "$url"
