        if: steps.el.outputs.made == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd out/audio && ls *.mp3 > /dev/null 2>&1 || exit 0
          python ../../tools/send_files.py . "CoinSense · TOOLING V2 · AUDIO TEST" --text audio_test.txt $(ls *.mp3)
