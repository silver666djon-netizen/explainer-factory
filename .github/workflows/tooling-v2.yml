    if: always() && github.event.inputs.test != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q numpy requests pillow 2>&1 | tail -2
      - name: Fonts for the contact sheet
        run: curl -fsSL -o assets/fonts/SpecialElite-Regular.ttf https://github.com/google/fonts/raw/main/apache/specialelite/SpecialElite-Regular.ttf || true
      - name: Remotion 4.0.541 install + typecheck
        working-directory: pilot/remotion
        run: |
          set -o pipefail
          s0=$(date +%s); npm install --no-audit --no-fund 2>&1 | tail -3; echo "npm install: $(( $(date +%s) - s0 )) s"
          npx remotion versions 2>&1 | tail -25
          npx tsc --noEmit -p . 2>&1 | tail -40 || true
      - name: Draft audio + probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/rel.sh download $TAG rel "*.mp3" "*.mp3.json" probe.json || true
      - name: Prep (LoC photo, Lottie, HyperFrames overlay, Lottie hit)
        run: python tools/tooling_test.py prep rel out 2>&1 | tail -60
      - name: Render + checks
        run: python tools/tooling_test.py render out 2>&1 | tail -120
      - name: Report
        if: always()
        run: |
          python tools/tooling_test.py report out rel/probe.json 2>&1 | tail -60
          tail -c 3500 out/tooling_test.md | python3 -c 'import sys; print("::notice title=tooling test::" + sys.stdin.read().replace("%","%25").replace("\n","%0A"))'
          cp docs/ASSET_LICENSES.md out/ASSET_LICENSES_after_test.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-test
          path: |
            out/*.mp4
            out/*.md
            out/*.json
            out/*.log
            out/*.png
            out/stills
          retention-days: 7
      - name: Publish into the draft tooling-v2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls out/tooling_test.mp4 out/tooling_test_sheet.png out/tooling_test.md out/render.json out/prep.json out/ASSET_LICENSES_after_test.md 2>/dev/null || true)
          [ -n "$files" ] || exit 0
          if tools/rel.sh id $TAG >/dev/null 2>&1; then tools/rel.sh upload $TAG $files
          else gh release create $TAG $files --title "CoinSense · TOOLING V2" --notes "Tooling v2 (not for upload)." --prerelease --draft; fi
