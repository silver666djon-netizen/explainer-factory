name: Voice samples (Ep.4 v2 cold open)
# Klot, Ep.4 v2 Stage 1: the cold open read by three expressive voices over the same music bed (tools/voice_samples.py).
# Writes the mp3s + voice_samples.json into the draft release ep04v2-stage1 (kept: later Stage 1 files are added to it).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "which samples to (re)make: any of A B C"
        required: false
        default: "ABC"
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-whisper-v1
          restore-keys: kokoro-
      - name: Python packages
        run: |
          pip install -q chatterbox-tts 2>&1 | tail -3
          pip install -q "kokoro>=0.9.4" requests soundfile 2>&1 | tail -3
          python -c "import torch, chatterbox, kokoro; print('torch', torch.__version__)"
      - name: Voice the cold open
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ONLY: ${{ github.event.inputs.only || 'ABC' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p vs
          tools/rel.sh download ep04v2-stage1 vs voice_samples.json 2>/dev/null || true
          python tools/voice_samples.py vs 2>&1 | tee vs.log || true
          grep -E "^(A_|B_|C_|openrouter audio|GEMINI)" vs.log | python3 -c 'import sys; t=sys.stdin.read(); print("::notice title=voices::" + t.replace("%","%25").replace("\n","%0A"))'
          ls -la vs
      - name: STT check of every sample (in the release + made now)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q faster-whisper 2>&1 | tail -2
          for f in $(tools/rel.sh assets ep04v2-stage1 | cut -f2 | grep '^cs_ep04v2_cold_open_.*mp3$'); do [ -f "vs/$f" ] || tools/rel.sh download ep04v2-stage1 vs "$f"; done
          python tools/voice_samples.py stt vs 2>&1 | tail -5 | python3 -c 'import sys; print("::notice title=stt::" + sys.stdin.read().replace("%","%25").replace("\n","%0A"))'
      - name: Publish (draft release ep04v2-stage1)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls vs/*.mp3 vs/voice_samples.json vs/stt_check.md 2>/dev/null || true)
          [ -n "$files" ] || exit 1
          if tools/rel.sh id ep04v2-stage1 >/dev/null 2>&1; then tools/rel.sh upload ep04v2-stage1 $files
          else gh release create ep04v2-stage1 $files --title "CoinSense · EP04v2 · STAGE 1" --notes "Ep.4 v2 Stage 1 (draft, not for upload)." --prerelease --draft; fi
